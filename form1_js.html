<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        header {
            display: flex;
            align-items: center;
            color: rgb(9, 6, 6);
            font-size: 20px;
            font-family: 'Raleway', sans-serif;
            background-color: rgb(4, 170, 109);
            color: white;
        }


        main {
            width: 700px;
            margin: 40px auto;
        }

        form {
            background-color: white;
            padding: 35px;
            border-radius: 10px;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 30px;
        }

        body {
            margin: 0;
            background-color: #e3e6e5;
            font-family: 'Raleway', sans-serif;
            color: #333;
        }

        .logo {
            width: 40px;
            height: 40px;
            margin-left: 30px;
            padding: 20px;
        }

        label {
            display: inline-block;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .optional {
            color: gray;
            font-size: 14px;
        }

        input[type="text"],
        input[type="date"],
        select,
        textarea {
            padding: 10px;
            border: 2px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            margin-bottom: 10px;
        }

        textarea {
            width: 50%;
            height: 80px;
            resize: vertical;
        }

        button {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: rgb(4, 170, 109);
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        footer {
            text-align: center;
            color: #777;
            font-size: 13px;
            padding: 20px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <header>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRhEWMJyWhGPNuUu6_bfkG9ypezsR7GqWxfjY5qP9u2Aw&s=10"
            class="logo">
        <h1>HGU Shop</h1>
    </header>

    <main>

        <form id="userForm">

            <h2>회원가입</h2>

            <label for="firstName">성</label>
            <input type="text" id="firstName" name="firstName" required>
            <label for="lastName">이름</label>
            <input type="text" id="lastName" name="lastName" required><br><br>

            <label for="username">유저 이름</label>
            <input type="text" id="username" name="username" placeholder="Username" minlength="2" required><br><br>

            <label for="email">이메일 <span class="optional">(선택사항)</span> </label>
            <input type="email" id="email" name="email" placeholder="hgu123@gmail.com"><br><br>

            <label for="number">전화번호</label>
            <input type="text" id="number" name="number" placeholder="010-XXXX-XXXX" required><br><br>

            <label for="birth">생일</label>
            <input type="date" id="birth" name="birth" required><br><br>

            <label for="country">국가</label>
            <select id="country" name="country" required>
                <option value="">Choose...</option>
                <option value="korea">한국</option>
                <option value="usa">미국</option>
                <option value="japan">일본</option>
                <option value="uk">영국</option>
                <option value="china">중국</option>
            </select><br><br>

            <label for="message">어떻게 가입하게 되었나요? <span class="optional">(선택사항)</span> </label><br>
            <textarea id="message" name="message"></textarea><br><br>

            <input type="checkbox" id="sameAddress" name="sameAddress" required>
            <label for="sameAddress">
                개인정보 수집 및 이용에 동의합니다.
            </label><br>
            <input type="checkbox" id="saveInfo" name="saveInfo" required>
            <label for="saveInfo">
                문자 및 SNS 수신에 동의합니다.
            </label>

            <hr>

            <h2>결제 방법</h2>

            <input type="radio" id="creditCard" name="payment" value="credit" required>
            <label for="creditCard">신용카드</label>
            <input type="radio" id="debitCard" name="payment" value="debit">
            <label for="debitCard">체크카드</label><br><br>

            <label for="cardName">카드에 표시된 이름</label>
            <input type="text" id="cardName" name="cardName" required><br>
            <label for="cardNumber">신용 카드 번호</label>
            <input type="text" id="cardNumber" name="cardNumber" required><br><br>

            <label for="expiration">신용 카드 만료일</label>
            <input type="text" id="expiration" name="expiration" required><br>
            <label for="cvv">CVV</label>
            <input type="text" id="cvv" name="cvv" required required><br><br>

            <button type="submit">가입하기</button>
        </form>
    </main>


    <footer>
        <p>©2026-fall-OSS </p>
        <p>Created by 장영진 (22200635)</p>
    </footer>

    <script>
        const form = document.querySelector("#userForm");

        form.addEventListener("submit", function (event) {

            const email = document.querySelector("#email");
            const firstName = document.querySelector("#firstName");
            const lastName = document.querySelector("#lastName");
            const sameAddress = document.querySelector("#sameAddress");
            const creditCard = document.querySelector("#creditCard");

            if (!firstName.checkValidity()) {
                event.preventDefault();
                alert("성을 입력하세요.");
                firstName.focus();
                return;
            }

            if (!lastName.checkValidity()) {
                event.preventDefault();
                alert("이름을 입력하세요.");
                lastName.focus();
                return;
            }

            if (!email.checkValidity()) {
                event.preventDefault();
                alert("이메일 양식이 잘못되었습니다!");
                email.focus();
                return;
            }

            if (!sameAddress.checkValidity()) {
                event.preventDefault();
                alert("개인정보 수집 및 이용에 동의해야합니다!");
                sameAddress.focus();
                return;
            }

            if (!creditCard.checkValidity()) {
                event.preventDefault();
                alert("결제 방법을 선택해야합니다!");
                creditCard.focus();
                return;
            }

            event.preventDefault();
            alert("회원가입이 완료되었습니다.");
        });
    </script>

</body>

</html>
